<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AiDM Stream Inspector</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header><h1>AiDM Stream Inspector</h1></header>
  <main id="popup-content" aria-busy="true">
    <div id="state-message" role="status">
      <p id="state-summary">Checking this tab…</p>
      <p id="state-help" class="secondary" hidden></p>
    </div>
    <p id="selection-error" class="secondary" role="status" hidden></p>
    <div id="playback-details" hidden>
      <h2 id="playback-title" dir="auto"></h2>
      <p id="capture-age" class="secondary" hidden></p>
      <section class="source-summary" aria-labelledby="source-heading">
        <h3 id="source-heading">Source</h3>
        <p id="source-type"></p>
      </section>
      <section aria-labelledby="media-heading" role="radiogroup">
        <h3 id="media-heading">Media</h3>
        <div id="best-media" class="best-media" hidden>
          <p class="best-label">Best candidate</p>
          <div id="best-media-row"></div>
        </div>
        <p id="media-unavailable" class="secondary" hidden>Best candidate unavailable</p>
        <details id="other-media" hidden>
          <summary id="other-media-summary"></summary>
          <ul id="other-media-list" tabindex="0" aria-label="Other detected streams"></ul>
        </details>
        <p id="media-omitted" class="secondary" hidden></p>
      </section>
      <section aria-labelledby="subtitle-heading">
        <h3 id="subtitle-heading">Subtitles</h3>
        <p id="subtitle-empty" class="secondary">None detected</p>
        <ul id="subtitle-list" hidden></ul>
      </section>
      <section aria-labelledby="session-heading">
        <h3 id="session-heading">Session</h3>
        <p id="session-unavailable" class="secondary" hidden>Request context not available</p>
        <dl id="session-context">
          <div><dt>User-Agent</dt><dd id="session-user-agent"></dd></div>
          <div><dt>Referer</dt><dd id="session-referer"></dd></div>
          <div><dt>Origin <span class="secondary">(diagnostic)</span></dt><dd id="session-origin"></dd></div>
          <div><dt>Cookies</dt><dd id="session-cookies"></dd></div>
        </dl>
      </section>
      <div class="copy-action">
        <button id="copy-playback" type="button" aria-live="polite" hidden disabled>Copy for AiDM</button>
        <p id="copy-error" class="secondary" role="status" hidden></p>
      </div>
    </div>
  </main>
</body>
</html>
